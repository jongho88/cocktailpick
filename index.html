<style>
:root{
  --pri:#8CC63F;--pri-d:#3F7A14;--pri3:#4C8C1C;--mint:#EAF5DA;
  --cream:#F7F8F1;--card:#FFFFFF;--ink:#1C2416;--muted:#69735E;--line:#DEE4D2;
  --gold:#B88A3E;
  --r:18px;--shadow:0 1px 2px rgba(20,40,10,.06),0 6px 20px rgba(20,40,10,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:16px;line-height:1.6;word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 18px 10px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:6px;background:none;border:0;padding:0}
.wp-link{font-size:12px;color:#7E8C6E;text-decoration:none;opacity:.75;letter-spacing:.02em}
.brand{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.brand.press{transform:scale(.96);transition:transform .5s}
.wp-card .cel-k{color:#B30737}
.wp-card .btn.wp{background:#B30737;color:#fff;text-decoration:none}
.brand .script{font-size:18px;line-height:1;font-weight:400;letter-spacing:.14em}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid;display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
main{flex:1;padding:8px 18px calc(96px + env(safe-area-inset-bottom))}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;z-index:6;
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tab{border:0;background:none;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;border-radius:12px}
.tab svg{width:24px;height:24px}
.tab.on{font-weight:700}
h1{font-size:27px;line-height:1.3;letter-spacing:-.03em;margin:14px 0 6px}
h2{font-size:21px;line-height:1.35;letter-spacing:-.02em;margin:22px 0 10px}
h3{font-size:17px;margin:0 0 4px;letter-spacing:-.01em}
p{margin:0 0 10px}
.small{font-size:14px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin:12px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:16px;background:var(--pri);color:#142008;min-height:50px}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--pri-d);border:1.5px solid var(--pri-d)}
.btn.soft{background:var(--mint);color:var(--pri-d)}
.btn.danger{background:#fff;color:#B3261E;border:1.5px solid #F0B8B3}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--mint);color:var(--pri-d);font-size:13px;font-weight:600;margin:0 6px 6px 0}
.chip.gray{background:#EFF1E9;color:var(--muted)}
.chip.gold{background:#FFF3DA;color:#8A5F10}
/* learn */
.lcard{background:var(--card);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;margin-top:18px;scroll-margin-top:76px}
.ljump{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
.ljump::-webkit-scrollbar{display:none}
.ljump button{flex:none;border:1px solid rgba(200,232,156,.35);background:rgba(255,255,255,.06);color:#C8E89C;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600}
.lart{background:var(--mint);padding:22px 18px;min-height:150px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.lbody{padding:20px 20px 6px}
.lbody .kicker{font-size:13px;font-weight:700;color:var(--pri3);letter-spacing:.02em}
.tip{background:#FFF7E8;border-radius:14px;padding:12px 14px;margin:12px 0;font-size:15px}
.tip b{color:var(--gold)}
.en{font-size:.82em;font-weight:500;color:#7D8A6E;margin-left:5px;letter-spacing:.01em;font-style:italic}
.list{margin:6px 0 10px;padding:0;list-style:none}
.list li{padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.glassrow{display:flex;flex-direction:column;align-items:center;font-size:13px;font-weight:600;color:var(--pri-d)}
/* quiz */
.progress{height:6px;border-radius:4px;overflow:hidden;margin:14px 0 6px;background:rgba(255,255,255,.14)}
.progress i{display:block;height:100%;background:var(--pri);border-radius:4px;transition:width .3s}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin:10px 0;font-size:16px;font-weight:600}
.opt .o{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
.opt.on{border-color:var(--pri-d);background:#F4FAEC}
.opt.on .o{border:7px solid var(--pri-d)}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.back{border:0;background:none;padding:6px 0;display:inline-flex;gap:4px;align-items:center}
/* result */
.profile{background:linear-gradient(160deg,#FFF 0%,var(--mint) 100%);border-radius:24px;padding:20px;box-shadow:var(--shadow);margin-top:12px}
.nick{font-size:24px;font-weight:800;color:var(--pri-d);letter-spacing:-.03em;margin:2px 0 10px}
.taste{display:grid;grid-template-columns:62px 1fr;gap:6px 10px;align-items:center;font-size:14px}
.bar{display:flex;gap:4px}
.bar i{flex:1;height:8px;border-radius:4px;background:#E2E7D6}
.bar i.on{background:#7DBA34}
.ctl{background:var(--card);border-radius:22px;box-shadow:var(--shadow);margin:14px 0;overflow:hidden}
.chead{display:flex;gap:14px;align-items:center;padding:18px 18px 10px}
.chead .g{flex:none;width:58px;height:72px;border-radius:14px;background:var(--cream);display:grid;place-items:center}
.chead .rank{font-size:12px;font-weight:800;color:var(--pri3)}
.chead .enn{font-size:13px;color:var(--muted);font-style:italic;margin:-2px 0 4px}
.cbody{padding:0 18px 18px}
.why{background:#F3F9EA;border-left:3px solid var(--pri3);border-radius:0 12px 12px 0;padding:10px 12px;margin:10px 0;font-size:15px}
.why div{margin:2px 0}
.kv{display:grid;grid-template-columns:78px 1fr;gap:4px 10px;font-size:15px;margin:10px 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.ask{background:var(--cream);border-radius:12px;padding:10px 12px;font-size:15px;margin:10px 0}
.ingl{list-style:none;margin:6px 0 10px;padding:0}
.ingl li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.ingl li:first-child{border-top:0}
.ingl .mk{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:#EFF1E9;color:var(--muted)}
.ingl .mk.have{background:var(--pri);color:#142008}
.ingl .mk.miss{background:#FFF0E6;color:#B4561B}
.ingl .nm{flex:1}
.ingl .nm small{color:var(--muted);font-size:12px;margin-left:4px}
.ingl .am{font-weight:700;white-space:nowrap;text-align:right}
.ingl .am small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.howto{margin:6px 0 12px;padding:0;list-style:none;counter-reset:st}
.howto li{position:relative;padding:8px 0 8px 36px;font-size:15px}
.howto li::before{counter-increment:st;content:counter(st);position:absolute;left:0;top:8px;width:24px;height:24px;border-radius:8px;background:var(--mint);color:var(--pri-d);font-weight:800;font-size:13px;display:grid;place-items:center}
/* records */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px;text-align:center}
.stat b{display:block;font-size:21px;color:var(--pri-d)}
.stat span{font-size:12px;color:var(--muted)}
.rec,.ck{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:0;border-radius:18px;box-shadow:var(--shadow);padding:14px;margin:10px 0}
.rec .g,.ck .g{flex:none;width:48px;height:58px;border-radius:12px;background:var(--cream);display:grid;place-items:center;overflow:hidden}
.rec .t,.ck .t{flex:1;min-width:0}
.rec .t b,.ck .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck .t .enn{font-size:12.5px;color:var(--muted);font-style:italic}
.ck .need{font-size:13.5px;font-weight:700;color:#A0661A;margin-top:2px}
.ck .mini-t{font-size:12.5px;color:var(--muted)}
.stars{color:#E0A83B;letter-spacing:1px;font-size:14px}
.empty{text-align:center;padding:30px 10px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,14,6,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s;cursor:pointer}
.sheet{cursor:auto;background:var(--cream);color:var(--ink);width:100%;max-width:520px;max-height:84vh;max-height:84dvh;overflow:auto;overscroll-behavior:contain;position:relative;border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease-out}
.grab{width:40px;height:5px;border-radius:3px;background:#CFD6C2;margin:4px auto 10px}
.sheet-top{position:sticky;top:-10px;z-index:2;background:var(--cream);margin:-10px -18px 0;padding:10px 18px 2px}
.sheet-x{position:absolute;right:12px;top:8px;width:34px;height:34px;border-radius:50%;border:0;background:#E7EBDD;color:#55604A;display:grid;place-items:center}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
@keyframes fade{from{opacity:0}}
.field{margin:14px 0}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-size:16px}
.field textarea{min-height:80px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--pri3)}
.starpick{display:flex;gap:6px}
.starpick button{border:0;background:none;font-size:34px;line-height:1;color:#DCE1D2;padding:0 2px}
.starpick button.on{color:#E0A83B}
.seg{display:flex;flex-wrap:wrap;background:#E7EBDD;border-radius:12px;padding:4px;gap:2px}
.seg button{flex:1 0 auto;border:0;background:none;border-radius:9px;padding:9px 8px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--pri-d);box-shadow:0 1px 3px rgba(0,0,0,.08)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1C2416;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{font-size:12.5px;text-align:center;margin:26px 0 6px}
.sec-title{display:flex;justify-content:space-between;align-items:center}
.sec-title h2{margin-bottom:6px}
.link{border:0;background:none;font-weight:700;padding:4px}
/* ---------- 시작 화면 ---------- */
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(120% 80% at 50% 30%,#4E8F1F 0%,#25480F 45%,#0A1306 100%);color:#F1FAE4;overflow:hidden;cursor:pointer;
  transition:transform .8s cubic-bezier(.7,0,.2,1),opacity .8s ease}
#splash:focus{outline:none}
#splash.out{transform:translateY(-100%);opacity:.6}
#splash .glow{position:absolute;width:420px;height:420px;border-radius:50%;top:50%;left:50%;margin:-280px 0 0 -210px;
  background:radial-gradient(circle,rgba(200,240,140,.32) 0%,rgba(200,240,140,0) 65%);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}
#splash .bub{position:absolute;bottom:-20px;border-radius:50%;background:rgba(220,245,190,.5);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-110vh) translateX(var(--dx,0));opacity:0}}
.sp-glass{position:relative;width:150px;height:250px;transform-origin:50% 92%;
  animation:drop .7s cubic-bezier(.2,1.4,.4,1) both, sway 2.6s ease-in-out .7s infinite}
@keyframes drop{from{transform:translateY(-60px) scale(.6);opacity:0}}
@keyframes sway{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.sp-glass svg{width:100%;height:100%;overflow:visible}
.sp-fill{animation:fill 1.6s cubic-bezier(.4,0,.2,1) .5s both}
@keyframes fill{from{transform:translateY(176px)}to{transform:translateY(62px)}}
.sp-wave{animation:wave 1.1s linear infinite}
.sp-wave2{animation:wave 1.7s linear infinite reverse;opacity:.55}
@keyframes wave{from{transform:translateX(-60px)}to{transform:translateX(0)}}
.sp-pour{stroke-dasharray:140;stroke-dashoffset:140;animation:pour 1.7s ease .35s both}
@keyframes pour{25%{stroke-dashoffset:0;opacity:1}75%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-140;opacity:0}}
.sp-ice{opacity:0;animation:icein .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes icein{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:none}}
.sp-in-bub{animation:inbub 2.2s ease-in infinite;opacity:0}
@keyframes inbub{0%{opacity:0;transform:translateY(0)}15%{opacity:.9}100%{opacity:0;transform:translateY(-90px)}}
.sp-lime{transform-box:fill-box;transform-origin:center;animation:limein .8s cubic-bezier(.2,1.5,.4,1) 1.9s both}
@keyframes limein{from{opacity:0;transform:translateY(-70px) rotate(-120deg)}to{opacity:1;transform:none}}
.sp-mint{transform-box:fill-box;transform-origin:50% 100%;animation:mintin .7s cubic-bezier(.2,1.5,.4,1) 2.15s both}
@keyframes mintin{from{opacity:0;transform:scale(.2)}}
.sp-straw{animation:strawin .6s cubic-bezier(.2,1.3,.4,1) 1.7s both}
@keyframes strawin{from{opacity:0;transform:translateY(-50px)}}
.sp-spark{transform-origin:center;transform-box:fill-box;animation:spark 1.8s ease-in-out infinite;opacity:0}
@keyframes spark{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.script{font-family:"Noto Sans KR","Apple SD Gothic Neo",-apple-system,"Helvetica Neue",sans-serif;font-weight:200;letter-spacing:.05em}
.sp-titlewrap{position:relative;margin-top:14px;display:flex;flex-direction:column;align-items:center}
.sp-title{font-size:50px;line-height:1.25;padding:0 18px;letter-spacing:.07em;
  background:linear-gradient(100deg,#F4FBE8 0%,#D2EEA6 35%,#E9BC6E 48%,#FFF8E8 52%,#D2EEA6 65%,#F4FBE8 100%);background-size:260% 100%;background-position:100% 0;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 18px rgba(170,230,110,.35));
  clip-path:inset(-20% 100% -20% 0);animation:write 1.6s cubic-bezier(.45,.1,.3,1) 1.1s forwards, shimmer 3.2s ease-in-out 2.9s infinite}
@keyframes write{to{clip-path:inset(-20% -5% -20% 0)}}
@keyframes shimmer{0%{background-position:100% 0}60%,100%{background-position:0 0}}
.sp-flourish{width:250px;height:26px;margin-top:-10px;overflow:visible}
.sp-flourish path{stroke-dasharray:300;stroke-dashoffset:300;animation:draw 1.1s ease-out 2.4s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sp-tag{margin-top:6px;font-size:16px;color:#D9EDC0;opacity:0;animation:tag .8s ease 2.7s forwards;letter-spacing:.02em}
@keyframes tag{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sp-skip{position:absolute;bottom:calc(48px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;
  padding:12px 22px;border-radius:999px;border:1.5px solid rgba(220,240,200,.45);background:rgba(255,255,255,.08);
  font-size:16px;font-weight:700;color:#EFFAE0;opacity:0;animation:tag .7s ease 3.1s forwards, breathe 1.8s ease-in-out 3.8s infinite}
@keyframes breathe{50%{transform:scale(1.05);background:rgba(255,255,255,.16)}}
.tapdot{width:10px;height:10px;border-radius:50%;background:#B9E27A;box-shadow:0 0 0 0 rgba(185,226,122,.7);animation:ping 1.8s ease-out infinite}
@keyframes ping{to{box-shadow:0 0 0 12px rgba(185,226,122,0)}}
#app.enter{animation:enter .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(30px) scale(.98)}}
@media (prefers-reduced-motion:reduce){
  .sp-glass,.sp-fill,.sp-wave,.sp-wave2,.sp-title,.sp-flourish path,.sp-tag,.sp-pour,#splash .bub,#splash .glow,.sp-ice,.sp-lime,.sp-mint,.sp-straw,.sp-in-bub{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}
}
/* ---------- 바 테마 (어두운 배경) ---------- */
html,body{background-color:#10140E;color:#EEF5E4;
  background-image:radial-gradient(90% 40% at 50% 0%,rgba(160,220,90,.14),transparent 70%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 34px),
  repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 1px,transparent 1px 68px)}
:is(.card,.lcard,.ctl,.rec,.ck,.stat,.profile,.opt,.sheet,.tip){color:var(--ink)}
.muted{color:#A9BC92}
:is(.card,.lcard,.ctl,.rec,.ck,.stat,.profile,.opt,.sheet,.tip) .muted{color:var(--muted)}
.top{background:rgba(16,20,14,.88);border-bottom:1px solid rgba(255,255,255,.06)}
.iconbtn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14)}
.iconbtn svg{stroke:#C8E89C}
.tabs{background:rgba(10,14,8,.96);border-top:1px solid rgba(255,255,255,.08)}
.tab{color:#8C9C7A}.tab.on{color:#A9DB62}
.link{color:#C8E89C}
main .btn.ghost{color:#C8E89C;border-color:rgba(200,232,156,.6)}
main :is(.card,.lcard,.ctl) .btn.ghost{color:var(--pri-d);border-color:var(--pri-d)}
.back{color:#A9BC92}.foot{color:#8C9C7A}
h1.thin{font-weight:300;font-size:22px;letter-spacing:.01em;margin:16px 0 2px}
.cellar-sub{font-size:14px;color:#A9BC92;margin-bottom:18px}
.shelf{display:grid;grid-template-columns:repeat(4,1fr);align-items:end;padding:0 4px;min-height:140px;position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.plank{height:14px;border-radius:3px;background:linear-gradient(#9A6538,#5E3A1E);box-shadow:0 10px 18px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,220,180,.35);position:relative}
.plank::before,.plank::after{content:"";position:absolute;top:14px;width:10px;height:16px;background:#3B230F;border-radius:0 0 3px 3px}
.plank::before{left:16px}.plank::after{right:16px}
.caps{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin:20px 0 4px;font-size:14.5px;font-weight:600;color:#EAF5DA;line-height:1.35}
.caps small{display:block;font-size:11.5px;font-weight:400;color:#9DB085;margin-top:2px}
.bt{justify-self:center;border:0;background:none;padding:0;display:flex;justify-content:center;align-items:flex-end;transition:transform .25s cubic-bezier(.2,1.4,.4,1);filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
.bt svg{width:76px;height:122px}
.bt:hover,.bt:focus-visible{transform:translateY(-10px) rotate(-3deg)}
.bt:active{transform:translateY(-16px) rotate(-4deg)}
.bt.hint{animation:nudge 3.2s ease-in-out 1.2s infinite}
@keyframes nudge{0%,80%,100%{transform:none}86%{transform:translateY(-8px) rotate(-4deg)}92%{transform:translateY(0) rotate(2deg)}}
.shelf-title{display:flex;justify-content:space-between;align-items:baseline;margin:34px 0 10px}
.shelf-title h2{margin:0;font-size:18px;font-weight:600}
.rack{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px}
.slot{border:0;background:none;padding:0;text-align:left;color:#EEF5E4}
.slot .lb{position:relative;height:60px;display:flex;align-items:flex-end;gap:8px;padding:0 6px;transition:transform .2s}
.slot:active .lb{transform:translateY(-4px)}
.slot .lb svg{flex:none;width:34px;height:54px;filter:drop-shadow(0 4px 5px rgba(0,0,0,.5))}
.slot .tag{flex:1;min-width:0;margin-bottom:8px;background:#1B2617;border:1px solid rgba(200,232,156,.22);border-radius:8px;padding:5px 8px;font-size:12px;font-weight:700;color:#E2F1CC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .plank{height:9px}.slot .plank::before,.slot .plank::after{display:none}
.slot .meta{font-size:12px;color:#9DB085;margin-top:6px;display:flex;justify-content:space-between}
.slot .meta .stars{font-size:11px}
.slot.add .lb{border:1.5px dashed rgba(200,232,156,.4);border-radius:10px;justify-content:center;align-items:center;color:#C8E89C;font-size:14px;font-weight:600;height:58px}
.mini-shelf{display:grid;grid-template-columns:repeat(4,1fr);align-items:end;padding:0 4px;gap:4px}
.mini-shelf .bt svg{width:44px;height:70px}
.mini-caps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;font-size:11.5px;line-height:1.3;color:#D3E6BC;margin-top:20px}
/* 홈바 */
.ing-g{margin:18px 0 6px}
.ing-g h3{font-size:15px;font-weight:600;color:#EAF5DA;margin-bottom:8px}
.ing-g h3 .en{color:#8FA37A}
.ing{border:1.5px solid rgba(200,232,156,.32);background:rgba(255,255,255,.05);color:#E2F1CC;border-radius:999px;padding:8px 13px;font-size:14.5px;font-weight:600;margin:0 6px 8px 0;line-height:1.2}
.ing.on{background:var(--pri);color:#142008;border-color:var(--pri)}
.ing.on::before{content:"✓ ";font-weight:800}
.barhead{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 14px;margin:6px 0 4px}
.barhead b{font-size:22px;color:#A9DB62;font-weight:700}
.barhead span{font-size:13px;color:#A9BC92}
.buy{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.buy button{border:1px solid rgba(233,188,110,.45);background:rgba(233,188,110,.1);color:#F3D9A4;border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600;text-align:left;line-height:1.3}
.buy button small{display:block;font-size:12px;font-weight:400;color:#D9C08A}
.prods{background:#FAFBF5;border:1px solid var(--line);border-radius:14px;padding:12px 12px 8px;margin:12px 0}
.prods-h{font-size:14px;font-weight:700;color:var(--pri-d);margin-bottom:4px}
.prods-h span{font-weight:500;color:var(--muted);font-size:12px;margin-left:4px}
.prod{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.prod:first-of-type{border-top:0}
.pn{flex:1;min-width:0}
.pn b{display:block;font-size:14.5px;line-height:1.35}
.pn small{display:block;font-size:12px;color:var(--muted);font-style:italic;line-height:1.35}
.pr{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tier{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:#EFF1E9;color:var(--muted)}
.tier.t3{background:#FFF3DA;color:#8A5F10}
.pr a{font-size:12px;color:var(--pri3);font-weight:600;text-decoration:none}
.prods-note{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.5}
/* 사진 */
.photo-pick{border-radius:14px;overflow:hidden;background:#fff;border:1.5px dashed var(--line)}
.photo-pick img{display:block;width:100%;max-height:190px;object-fit:cover}
.pp-empty{width:100%;border:0;background:none;padding:22px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--pri-d);font-weight:600;font-size:15px}
.pp-btns{display:flex;border-top:1px solid var(--line)}
.pp-btns button{flex:1;border:0;background:#fff;padding:11px;font-weight:600;color:var(--pri-d)}
.pp-btns button+button{border-left:1px solid var(--line);color:#B3261E}
.rec .g.has{width:54px;height:54px}
.rec .g img{width:100%;height:100%;object-fit:cover;display:block}
.price-in{display:flex;border:1.5px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.price-in:focus-within{border-color:var(--pri3)}
.price-in button{border:0;background:var(--mint);color:var(--pri-d);font-weight:800;font-size:17px;width:46px}
.price-in input{border:0!important;border-radius:0!important;min-width:0}
.price-in input:focus{outline:none}
/* 메달 */
.medals{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:0 0 14px}
.medal{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#EAF5DA}
.medal small{display:block;font-size:10.5px;font-weight:400;color:#9DB085;font-style:italic}
.medal-next{font-size:12px;color:#9DB085}
.celebrate{position:fixed;inset:0;z-index:40;background:rgba(6,12,4,.72);display:grid;place-items:center;padding:24px;animation:fade .25s}
.cel-card{position:relative;background:var(--cream);color:var(--ink);border-radius:24px;padding:24px 22px 20px;width:100%;max-width:330px;text-align:center;animation:popin .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes popin{from{transform:scale(.6);opacity:0}}
.cel-medal{margin-top:-70px;animation:spinin 1s cubic-bezier(.2,1.2,.4,1) .1s both}
@keyframes spinin{from{transform:rotateY(540deg) scale(.4);opacity:0}}
.cel-k{font-size:15px;font-weight:700;color:var(--pri3);margin-top:4px}
.cel-n{font-size:26px;font-weight:300;letter-spacing:.02em;margin-top:2px}
.cel-e{font-size:13px;color:var(--muted);font-style:italic}
.conf{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.conf i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) translateX(var(--dx)) rotate(720deg)}}
/* 숨은 셰이커 */
.secret-wrap{position:absolute;bottom:0;width:52px;height:140px;overflow:hidden;transform:translateX(-50%);pointer-events:none}
.secret{pointer-events:auto;border:0;background:none;padding:0;display:block;width:52px;height:140px;transform:translateY(102%);transition:transform .8s cubic-bezier(.2,1.25,.4,1);filter:drop-shadow(0 0 10px rgba(243,217,164,.45))}
.secret.up{transform:none}
.secret svg{width:44px;height:120px;margin-top:20px}
.lvtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:5px;margin:10px 0 12px}
.lvtabs button{position:relative;border:0;background:none;color:#A9BC92;border-radius:12px;padding:8px 4px;font-size:15px;font-weight:700;line-height:1.2}
.lvtabs button small{display:block;font-size:10.5px;font-weight:500;font-style:italic;opacity:.8}
.lvtabs button.on{background:var(--cream);color:var(--pri-d)}
.lvok{position:absolute;top:4px;right:6px;width:16px;height:16px;border-radius:50%;background:#C9A04E;color:#fff;font-size:10px;font-style:normal;display:grid;place-items:center}
.opt.qo.ok{border-color:#3F7A14;background:#F1F8EA}.opt.qo.ok .o{border:7px solid #3F7A14}
.opt.qo.no{border-color:#C2475E;background:#FFF2F4}.opt.qo.no .o{border:7px solid #C2475E}
.opt.qo:disabled{cursor:default;color:var(--ink)}
</style>
</head>

<div id="app">
  <header class="top">
    <button class="brand" data-go="home" aria-label="CocktailPick 홈으로">
      <span class="script"><span style="color:#8CC63F">Cocktail</span><span style="color:#C9B45A">Pick</span></span>

  art:()=>grid(3,[tile('보드카','Vodka'),tile('진','Gin'),tile('럼','Rum'),tile('테킬라','Tequila'),tile('위스키','Whisky'),tile('브랜디','Brandy')]),
  b:`<ul class="list">
  <li><b>보드카</b>${EN('Vodka')} — 맛과 향이 거의 없어 어떤 재료와도 잘 섞여요. 모스코 뮬, 코스모폴리탄.</li>
  <li><b>진</b>${EN('Gin')} — 노간주 열매(주니퍼베리)와 허브 향이 나요. 진 토닉, 네그로니.</li>
  <li><b>럼</b>${EN('Rum')} — 사탕수수로 만들어 은은하게 달콤해요. 화이트 럼은 가볍고, 다크 럼은 캐러멜 향이 진해요.</li>
  <li><b>테킬라</b>${EN('Tequila')} — 멕시코의 아가베로 만들어 풀 향과 흙 내음이 나요. 마르가리타, 팔로마.</li>
  <li><b>위스키</b>${EN('Whisky')} — 곡물로 만들어 오크통에서 숙성해요. 미국 버번은 바닐라·캐러멜 향으로 달콤한 편이에요.</li>
  <li><b>브랜디</b>${EN('Brandy')} — 포도 같은 과일로 만든 술이에요. 프랑스 코냑이 유명해요. 사이드카.</li></ul>`,
  tip:'기주는 대부분 도수가 <b>40% 정도</b>예요. 소주의 두 배가 넘으니 조금만 들어가도 세요.'},
 {k:'3. 맛을 내는 재료 · Mixers',t:'단맛, 신맛, 쓴맛, 그리고 거품',
  art:()=>[['시트러스','Citrus'],['시럽','Syrup'],['리큐르','Liqueur'],['비터스','Bitters'],['탄산','Soda']].map(([w,en])=>`<span class="chip" style="font-size:15px;padding:6px 14px;background:#fff;text-align:center;line-height:1.25">${w}<br><span class="en" style="margin:0">${en}</span></span>`).join(''),
  b:`<ul class="list">
  <li><b>시트러스</b>${EN('Citrus')} — 라임·레몬 즙이에요. 신맛 담당이고, 병 주스보다 바로 짠 즙이 훨씬 맛있어요.</li>
  <li><b>시럽</b>${EN('Syrup')} — 설탕과 물을 1:1로 녹인 <b>심플 시럽</b>${EN('Simple Syrup')}이 기본이에요. 찬 술에도 잘 섞여요.</li>
  <li><b>리큐르</b>${EN('Liqueur')} — 술에 과일·허브·커피 향과 단맛을 더한 술이에요. 트리플 섹(오렌지), 깔루아(커피).</li>
  <li><b>비터스</b>${EN('Bitters')} — 약초로 만든 아주 쓴 향료예요. 몇 방울(대시${EN('Dash')})만 넣어요.</li>
  <li><b>탄산</b>${EN('Soda')} — 탄산수(맛 없음), 토닉 워터(쌉쌀), 진저에일(생강), 콜라.</li></ul>`,
  tip:'시럽이 없으면 설탕 1큰술을 따뜻한 물 1큰술에 녹이면 돼요.'},
 {k:'4. 칵테일 잔 · Glassware',t:'잔만 봐도 어떤 칵테일인지 보여요',
  art:()=>[['highball','하이볼','Highball','#A8D86A'],['rocks','록스','Rocks','#B5651D'],['martini','마티니','Martini','#F1F3EA'],['coupe','쿠프','Coupe','#E9F2C9'],['flute','플루트','Flute','#F4E7A8']].map(([k,l,e,c])=>`<div class="glassrow">${glass(k,c,36)}<span>${l}</span><span class="en" style="margin:0">${e}</span></div>`).join(''),
  b:`<ul class="list">
  <li><b>하이볼</b>${EN('Highball')} — 길쭉한 잔이에요. 탄산이 들어간 칵테일(모히토, 진 토닉).</li>
  <li><b>록스</b>${EN('Rocks · Old Fashioned')} — 낮고 두꺼운 잔이에요. 얼음 위에 내는 진한 칵테일(네그로니, 올드 패션드).</li>
  <li><b>마티니</b>${EN('Martini')} — 역삼각형 잔이에요. 얼음 없이 차갑게(마티니, 코스모폴리탄).</li>
  <li><b>쿠프</b>${EN('Coupe')} — 넓고 둥근 잔이에요. 흔들어 거른 칵테일(다이키리, 사이드카).</li>
  <li><b>플루트</b>${EN('Flute')} — 좁고 긴 잔이에요. 거품을 오래 지켜 줘요(미모사, 프렌치 75).</li></ul>`,
  tip:'얼음 없이 내는 칵테일은 잔을 <b>냉동실에 5분</b> 넣어 두면 끝까지 차갑고 맛있어요.'},
 {k:'5. 만드는 방법 · Methods',t:'붓고, 흔들고, 젓고, 누르고',
  art:()=>grid(2,[tile('빌드','Build'),tile('셰이크','Shake'),tile('스터','Stir'),tile('머들','Muddle')]),
  b:`<ul class="list">
  <li><b>빌드</b>${EN('Build')} — 잔에 얼음과 재료를 바로 붓고 살짝 저어요. 가장 쉬워요(하이볼, 진 토닉).</li>
  <li><b>셰이크</b>${EN('Shake')} — 셰이커에 얼음과 넣고 10~15초 세게 흔들어요. 주스·시럽·크림이 들어가면 셰이크예요.</li>
  <li><b>스터</b>${EN('Stir')} — 얼음과 함께 20~30초 저어요. 술만 섞을 때(마티니, 네그로니) 맑고 매끄럽게 만들어요.</li>
  <li><b>머들</b>${EN('Muddle')} — 민트나 과일을 막대로 눌러 향과 즙을 내요(모히토).</li></ul>`,
  tip:'탄산은 절대 흔들지 마세요. 김이 빠지고 넘쳐요. 흔든 뒤 <b>마지막에</b> 부어요.'},
 {k:'6. 안전하게 즐기기 · Drink Responsibly',t:'달콤할수록 천천히',
  art:()=>grid(3,[tile('물 한 잔','Water'),tile('천천히','Slowly'),tile('음식과 함께','With Food')]),
  b:`<ul class="list">
  <li>칵테일은 달고 시원해서 술맛이 덜 나지만, 한 잔에 독한 술이 45~60ml 들어가요. <b>소주 두세 잔</b>과 비슷한 알코올이에요.</li>
  <li>롱 아일랜드 아이스티처럼 여러 술이 들어간 칵테일은 특히 세요.</li>
  <li>한 잔마다 물 한 잔, 빈속에는 마시지 않기.</li>
  <li>운전하는 날엔 절대 안 돼요. 대신 <b>목테일</b>을 골라요.</li></ul>`,
  tip:'술이 약하다면 <b>추천받기</b>에서 "가볍게"나 "술 없이"를 골라 보세요.'}
];
const LEARN_MID=[

 {k:'2. 칵테일 가족 · Cocktail Families',t:'구조를 알면 메뉴판이 읽혀요',

 {k:'4. 얼음 · Ice',t:'얼음도 재료예요',

  <li>큰 얼음은 천천히 녹아서 올드 패션드처럼 진한 칵테일에 좋아요.</li>
  <li>냉동실 냄새가 밴 얼음은 맛을 망쳐요. 생수로 얼리거나 편의점 얼음을 써요.</li></ul>`,
  tip:'모히토나 민트 줄렙엔 <b>잘게 부순 얼음</b>'+EN('Crushed Ice')+'. 지퍼백에 넣고 밀대로 두드리면 돼요.'},
 {k:'5. 리큐르와 베르무트 · Liqueurs & Vermouth',t:'한 병 사면 칵테일이 몇 배로 늘어요',

const inv=()=>new Set(store.get('inv',[]));
function reqs(c){return c.ing.filter(x=>!x[2]).map(x=>x[0]);}
function missingOf(c,have){return reqs(c).filter(id=>!have.has(id));}
function barResults(){
  const have=inv();const ready=[],one=[],two=[];
  COCKTAILS.forEach(c=>{const m=missingOf(c,have);if(!m.length)ready.push(c);else if(m.length===1)one.push({c,m:m[0]});else if(m.length===2)two.push({c,m});});
  const cnt={};one.forEach(x=>{cnt[x.m]=(cnt[x.m]||0)+1;});
  two.forEach(x=>{const k=x.m.slice().sort().join('+');cnt[k]=(cnt[k]||0)+.0001;});
  const buy=Object.entries(cnt).filter(([k,v])=>v>=1&&!k.includes('+')).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k,v])=>({id:k,n:Math.round(v),list:one.filter(x=>x.m===k).map(x=>x.c.name)}));
  return {have,ready,one,two,buy};
}

/* ---------- 추천 계산 ---------- */
function targetOf(ans){
  const s=({dry:1,ade:2.5,juice:4,milk:3.2}[ans.drink]??{black:1,latte:2.5,sweet:4,no:2.5}[ans.coffee])??2.5;
  const cb=({dry:2,ade:1,juice:.5,milk:.8}[ans.drink]??{black:2.5,latte:1,sweet:.5,no:1.5}[ans.coffee])??1.5;
  const bi=(({love:4,ok:2,no:.3}[ans.bitter]??2)*2+cb)/3;
  const a={love:4.2,ok:2.8,no:1.2}[ans.sour]??3;
  const st={light:1.2,mid:2.8,strong:4.5,zero:0}[ans.strength]??2.5;
  return {s,a,bi,st};
}
function recommend(ans){
  const T=targetOf(ans);
  const recs=store.get('records',[]);
  const liked=recs.filter(r=>r.style&&CMAP[r.style]&&r.rating>=4).map(r=>r.style);
  const disliked=recs.filter(r=>r.style&&CMAP[r.style]&&r.rating<=2).map(r=>r.style);
  const have=inv();const base=ans.strength==='zero'?'any':(ans.base||'any');
  const scored=COCKTAILS.map(c=>{
    let d=Math.abs(c.s-T.s)*1.2+Math.abs(c.a-T.a)*1.1+Math.abs(c.st-T.st)*1.2;
    d+= c.bi>T.bi ? (c.bi-T.bi)*1.2 : (T.bi-c.bi)*.4;
    let sc=12-d;const why=[];
    if(T.st===0){ if(c.st>0) sc-=30; else sc+=6; } else if(c.st===0) sc-=8;
    if(ans.fizz==='yes') sc+= c.fz?2:-.5; else if(ans.fizz==='no') sc+= c.fz?-4:.5;
    if(base!=='any'){ if(c.base===base) sc+=4; else sc-=6; }
    if(c.cr&&(ans.drink==='milk'||ans.coffee==='latte'||ans.coffee==='sweet')) sc+=ans.drink==='milk'?2:1;
    if(ans.occ&&c.occ.includes(ans.occ)){sc+=1.5;why.push(OCCWHY[ans.occ]);}
    if(ans.where==='home'){
      sc+= c.diff===1?1:c.diff===3?-1.5:0;
      if(have.size){const m=missingOf(c,have);
        if(!m.length){sc+=3;why.unshift('홈바 재료로 지금 바로 만들 수 있어요');}
        else if(m.length===1){sc+=1;why.push(`${ING[m[0]].n}만 있으면 집에서 만들 수 있어요`);}
        else sc-=.5;
      }else if(c.diff===1) why.push('집에서 만들기 쉬워요');
    }
    if(liked.includes(c.id)){sc+=2.5;why.unshift('전에 마시고 좋았다고 기록한 칵테일이에요');}
    else if(liked.some(id=>{const l=CMAP[id];return l.base===c.base&&Math.abs(l.s-c.s)+Math.abs(l.a-c.a)+Math.abs(l.bi-c.bi)<=2.5;})){sc+=1;why.push('전에 좋았던 칵테일과 비슷한 스타일이에요');}
    if(disliked.includes(c.id)) sc-=4;
    const tw=[];
    if(T.st===0) tw.push('술이 들어가지 않은 목테일이에요');
    if(T.s<=1.5&&c.s<=1) tw.push('달지 않은 맛을 좋아하셔서 드라이한 칵테일로 골랐어요');
    if(T.s>=3.5&&c.s>=3) tw.push('달콤한 맛을 좋아하셔서 단맛이 있는 칵테일이에요');
    if(T.a>=4&&c.a>=3) tw.push('새콤한 맛을 좋아하셔서 시트러스가 살아 있어요');
    if(T.a<=1.5&&c.a<=1) tw.push('신맛이 거의 없어 부드럽게 마실 수 있어요');
    if(T.bi>=2.8&&c.bi>=3) tw.push('쌉싸름한 맛을 좋아하셔서 쓴맛이 매력인 칵테일이에요');
    if(T.st>0&&T.st<=1.5&&c.st<=1.5&&c.st>0) tw.push('도수가 낮아 가볍게 즐기기 좋아요');
    if(T.st>=4&&c.st>=4) tw.push('술맛이 확실한 진한 칵테일이에요');
    if(ans.fizz==='yes'&&c.fz) tw.push('톡 쏘는 탄산이 시원해요');
    if(c.cr&&(ans.drink==='milk'||ans.coffee==='latte')) tw.push('밀크티처럼 부드러운 크림 맛이에요');
    return {c,sc,why:[...tw.slice(0,2),...why]};
  }).sort((x,y)=>y.sc-x.sc);
  const pick=[];const bc={};
  const pool=T.st===0?scored.filter(it=>it.c.st===0):scored;
  for(const it of pool){
    if(pick.length>=4)break;
    if(base==='any'&&(bc[it.c.base]||0)>=2)continue;
    pick.push(it);bc[it.c.base]=(bc[it.c.base]||0)+1;
  }
  for(const it of pool){if(pick.length>=4)break;if(!pick.includes(it))pick.push(it);}
  pick.forEach(it=>{const u=[...new Set(it.why)];it.why=u.slice(0,3);if(!it.why.length)it.why=['맛의 균형이 좋아 처음 마시기에도 편해요'];});
  return {T,items:pick.map(it=>({id:it.c.id,why:it.why})),ans,date:new Date().toISOString()};
}
function nickname(T,ans){
  if(T.st===0)return '무알코올 목테일 탐험가';
  let f='균형파';
  if(T.s>=3.5)f='달콤파';else if(T.bi>=2.8)f='쌉싸름파';else if(T.a>=4)f='상큼파';else if(T.st>=4.2)f='진한맛파';else if(T.st<=1.5)f='가벼운파';
  const t=ans.base&&ans.base!=='any'&&BASES[ans.base]?BASES[ans.base].label:'칵테일';
  return `${f} ${t} 탐험가`;
}

function drawQuiz(lv){

/* ---------- 사진 저장 (IndexedDB) ---------- */
const memPhotos={};
const PDB={db:null,
  open(){return new Promise(res=>{if(this.db)return res(this.db);try{const r=indexedDB.open('cocktailpick',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>{this.db=r.result;res(this.db);};r.onerror=()=>res(null);}catch(e){res(null);}});},
  async get(k){if(!k)return null;if(memPhotos[k])return memPhotos[k];const db=await this.open();if(!db)return null;return new Promise(res=>{try{const q=db.transaction('photos').objectStore('photos').get(k);q.onsuccess=()=>{if(q.result)memPhotos[k]=q.result;res(q.result||null);};q.onerror=()=>res(null);}catch(e){res(null);}});},
  async set(k,v){memPhotos[k]=v;const db=await this.open();if(!db)return;return new Promise(res=>{try{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>res();}catch(e){res();}});},
  async del(k){delete memPhotos[k];const db=await this.open();if(!db)return;try{db.transaction('photos','readwrite').objectStore('photos').delete(k);}catch(e){}}
};
function shrinkPhoto(file,max=720,q=.72){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{try{let w=img.naturalWidth,hh=img.naturalHeight;const k=Math.min(1,max/Math.max(w,hh));w=Math.round(w*k);hh=Math.round(hh*k);
      const c=document.createElement('canvas');c.width=w;c.height=hh;c.getContext('2d').drawImage(img,0,0,w,hh);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q));}catch(e){rej(e);}};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'));};img.src=url;
  });
}
function hydratePhotos(root){(root||document).querySelectorAll('[data-photo]').forEach(async el=>{const k=el.dataset.photo;if(!k)return;const d=await PDB.get(k);if(d){el.innerHTML=`<img src="${d}" alt="">`;el.classList.add('has');}});}
function fmtPrice(r){
  if(r.price==null||r.price==='')return '';
  const n=typeof r.price==='number'?r.price:parseFloat(String(r.price).replace(/[^0-9.]/g,''));
  if(isNaN(n))return '';
  return (r.cur||settings.currency)==='KRW'?'₩'+Math.round(n).toLocaleString('ko-KR'):'$'+(Number.isInteger(n)?n.toLocaleString('en-US'):n.toFixed(2));
}

function shakerSVG(){const id='s'+(++BID);return `<svg viewBox="0 0 44 120" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="#5E4416"/><stop offset=".25" stop-color="#C9A04E"/><stop offset=".42" stop-color="#F8E6B4"/><stop offset=".6" stop-color="#B8913E"/><stop offset="1" stop-color="#4E3810"/></linearGradient></defs><rect x="17" y="2" width="10" height="10" rx="3" fill="url(#${id})"/><path d="M12 14H32L34 30H10Z" fill="url(#${id})"/><rect x="8" y="30" width="28" height="5" rx="1.5" fill="url(#${id})"/><path d="M9 35H35L32 114Q32 118 28 118H16Q12 118 12 114Z" fill="url(#${id})"/><path d="M15 40V110" stroke="#fff" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/><text x="22" y="80" text-anchor="middle" font-size="6" letter-spacing="1" fill="#4E3810" font-family="Georgia,serif" transform="rotate(-90 22 78)">RESERVE</text></svg>`;}
function bindSecret(){
  const shelf=view.querySelector('.shelf');if(!shelf)return;
  let t=null,sx=0,sy=0;
  const cancel=()=>{clearTimeout(t);t=null;};
  shelf.addEventListener('pointerdown',e=>{
    if(e.target.closest('.bt')||shelf.querySelector('.secret-wrap'))return;
    sx=e.clientX;sy=e.clientY;const r=shelf.getBoundingClientRect();const x=e.clientX-r.left;
    t=setTimeout(()=>{t=null;revealSecret(shelf,x);},650);
  });
  shelf.addEventListener('pointermove',e=>{if(t&&(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10))cancel();});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>shelf.addEventListener(ev,cancel));
  shelf.addEventListener('contextmenu',e=>e.preventDefault());
}
function revealSecret(shelf,x){
  const w=document.createElement('div');w.className='secret-wrap';
  w.style.left=Math.max(26,Math.min(shelf.clientWidth-26,x))+'px';
  w.innerHTML=`<button class="secret" aria-label="숨은 셰이커">${shakerSVG()}</button>`;
  shelf.appendChild(w);
  try{navigator.vibrate&&navigator.vibrate(25);}catch(e){}
  requestAnimationFrame(()=>requestAnimationFrame(()=>w.firstElementChild.classList.add('up')));
  let hide=setTimeout(()=>sink(),6000);
  function sink(){const b=w.firstElementChild;if(!b)return;b.classList.remove('up');setTimeout(()=>w.remove(),700);}
  w.firstElementChild.onclick=()=>{clearTimeout(hide);showTip(()=>{hide=setTimeout(sink,1500);});};
}

function medalSVG(m,w){const id='m'+(++BID);return `<svg width="${w}" height="${w*1.35}" viewBox="0 0 40 54" aria-hidden="true"><defs><radialGradient id="${id}" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="${m.c[0]}"/><stop offset="1" stop-color="${m.c[1]}"/></radialGradient></defs>

      try{newPhoto=await shrinkPhoto(f);removePhoto=false;drawPick(newPhoto);}catch(e){toast('이 사진은 열 수 없어요');drawPick(null);}fp.value='';};
    const curBtn=s.querySelector('#fCur'),priceIn=s.querySelector('#fPrice');
    curBtn.onclick=()=>{cur=cur==='KRW'?'USD':'KRW';curBtn.textContent=cur==='KRW'?'₩':'$';priceIn.placeholder=cur==='KRW'?'15,000':'14';};
    priceIn.addEventListener('blur',()=>{const n=parseFloat(priceIn.value.replace(/[^0-9.]/g,''));if(!isNaN(n)&&cur==='KRW')priceIn.value=Math.round(n).toLocaleString('ko-KR');});
    s.querySelectorAll('#fStars button').forEach(b=>b.onclick=()=>{rating=+b.dataset.n;s.querySelectorAll('#fStars button').forEach(x=>x.classList.toggle('on',+x.dataset.n<=rating));});
    s.querySelectorAll('#fType button').forEach(b=>b.onclick=()=>{type=b.dataset.t;s.querySelectorAll('#fType button').forEach(x=>x.classList.toggle('on',x===b));});
    s.querySelectorAll('#fWhere button').forEach(b=>b.onclick=()=>{where=where===b.dataset.w?'':b.dataset.w;s.querySelectorAll('#fWhere button').forEach(x=>x.classList.toggle('on',x.dataset.w===where));});
    const sel=s.querySelector('#fStyle');
    sel.onchange=()=>{s.querySelector('#typeField').style.display=sel.value?'none':'';const n=s.querySelector('#fName');if(!n.value&&sel.value)n.value=CMAP[sel.value].name;};
    s.querySelector('#cancelRec').onclick=closeSheet;
    const del=s.querySelector('#delRec');
    if(del){let armed=false;del.onclick=()=>{if(!armed){armed=true;del.textContent='정말 지울까요? 한 번 더 누르세요';return;}
      if(r&&r.photo)PDB.del(r.photo);store.set('records',store.get('records',[]).filter(x=>x.id!==id));closeSheet();toast('기록을 지웠어요');render();};}
    s.querySelector('#recForm').onsubmit=e=>{
      e.preventDefault();
      const name=s.querySelector('#fName').value.trim();
      if(!name){s.querySelector('#fName').focus();return;}
      if(!rating){toast('별점을 눌러 주세요');return;}
      const style=sel.value;
      const rec={id:r?r.id:('r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),name,style,type:style?CMAP[style].base:type,rating,
        date:s.querySelector('#fDate').value||today(),price:(v=>{const n=parseFloat(v.replace(/[^0-9.]/g,''));return isNaN(n)?'':n;})(priceIn.value),cur,photo:removePhoto?'':(r&&r.photo)||'',where,place:s.querySelector('#fPlace').value.trim(),memo:s.querySelector('#fMemo').value.trim()};
      if(removePhoto&&r&&r.photo)PDB.del(r.photo);
      if(newPhoto){rec.photo=rec.id+'_p';PDB.set(rec.photo,newPhoto);}
      const all=store.get('records',[]);const k=all.findIndex(x=>x.id===rec.id);
      const before=all.length;
      if(k>=0)all[k]=rec;else all.push(rec);
      store.set('records',all);closeSheet();toast(r?'고쳤어요':'기록했어요 🍸');
      if(!r)checkMedal(before,all.length);
      if(!r&&(S.tab==='pick'||S.tab==='bar')){S.tab='log';}
      render();
    };
  });
}

function openSettings(){if(S.tab!=='settings'){S.prev=S.tab;}S.tab='settings';render();}
function renderSettings(){
  view.innerHTML=`<button class="back" id="sBack"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg>돌아가기</button><h1 class="thin" style="margin-top:6px">설정</h1><div class="card">
  <div class="field" style="margin-top:0"><label>가격 단위</label><div class="seg" id="cur"><button type="button" data-c="KRW" class="${settings.currency==='KRW'?'on':''}">원 (₩)</button><button type="button" data-c="USD" class="${settings.currency==='USD'?'on':''}">달러 ($)</button></div></div>
  <div class="field" style="margin-bottom:0"><label>레시피 용량 단위</label><div class="seg" id="unit"><button type="button" data-u="ml" class="${settings.unit!=='oz'?'on':''}">ml</button><button type="button" data-u="oz" class="${settings.unit==='oz'?'on':''}">oz (온스)</button></div></div></div>
  <div class="card" style="margin:16px 0"><h3>친구에게 알려 주기</h3><p class="small muted">이 앱 주소를 복사해서 카톡이나 문자로 보내세요. 친구 기록은 친구 폰에만 저장돼요.</p><button class="btn soft block" id="share">주소 복사하기</button></div>
  <div class="card" style="margin:16px 0"><h3>백업</h3><p class="small muted">기록과 홈바 재료는 이 폰의 이 브라우저에만 저장돼요. 브라우저 데이터를 지우면 사라지니 가끔 백업해 두세요. (사진은 백업에 들어가지 않아요)</p>
    <div class="row"><button class="btn ghost" id="exp">백업 복사</button><button class="btn ghost" id="imp">백업 불러오기</button></div>
    <textarea id="bk" style="display:none;width:100%;min-height:110px;margin-top:10px;border:1.5px solid var(--line);border-radius:12px;padding:10px;font-size:13px" placeholder="복사해 둔 백업 내용을 여기에 붙여 넣으세요"></textarea>
    <button class="btn block" id="impGo" style="display:none;margin-top:8px">이 내용으로 불러오기</button>
  </div>
  <div class="card"><h3>홈 화면에 추가하기</h3><p class="small muted" style="margin:0">아이콘이 생겨서 앱처럼 바로 열 수 있어요.<br>· 아이폰: 사파리 아래 공유 버튼 → <b>홈 화면에 추가</b><br>· 안드로이드: 크롬 오른쪽 위 ⋮ → <b>홈 화면에 추가</b></p></div>
  <button class="btn danger block" id="wipe" style="margin-top:6px">모든 기록 지우기</button>
  <p class="foot" style="margin-bottom:0">CocktailPick</p><p style="text-align:center;margin:2px 0 8px"><a class="wp-link" href="${WINEPICK_URL}" target="_blank" rel="noopener">🍷 WinePick ↗</a></p>`;
  const s=view;const back=()=>go(S.prev&&S.prev!=='settings'?S.prev:'home');
  s.querySelector('#sBack').onclick=back;
  s.querySelectorAll('#cur button').forEach(b=>b.onclick=()=>{settings.currency=b.dataset.c;store.set('settings',settings);s.querySelectorAll('#cur button').forEach(x=>x.classList.toggle('on',x===b));toast('가격 단위를 바꿨어요');});
  s.querySelectorAll('#unit button').forEach(b=>b.onclick=()=>{settings.unit=b.dataset.u;store.set('settings',settings);s.querySelectorAll('#unit button').forEach(x=>x.classList.toggle('on',x===b));toast('용량 단위를 바꿨어요');});
  s.querySelector('#share').onclick=async()=>{
    const url=location.href.split('#')[0];
    try{if(navigator.share){await navigator.share({title:'CocktailPick',text:'칵테일 초보를 위한 칵테일 추천 앱이에요',url});return;}}catch(e){if(e&&e.name==='AbortError')return;}
    copyText(url,'주소를 복사했어요');
  };
  const bk=s.querySelector('#bk'),goBtn=s.querySelector('#impGo');
  s.querySelector('#exp').onclick=()=>{
    const data=JSON.stringify({app:'CocktailPick',v:1,records:store.get('records',[]),inv:store.get('inv',[]),settings});
    bk.style.display='';goBtn.style.display='none';bk.value=data;bk.select();
    copyText(data,'백업을 복사했어요. 메모장이나 나에게 보내기로 저장해 두세요');
  };
  s.querySelector('#imp').onclick=()=>{bk.style.display='';goBtn.style.display='';bk.value='';bk.focus();};
  goBtn.onclick=()=>{
    try{const o=JSON.parse(bk.value);if(!o||!Array.isArray(o.records))throw 0;
      const cur=store.get('records',[]);const ids=new Set(cur.map(x=>x.id));
      const add=o.records.filter(x=>x&&x.id&&x.name&&!ids.has(x.id));
      store.set('records',cur.concat(add));
      if(Array.isArray(o.inv))store.set('inv',[...new Set(store.get('inv',[]).concat(o.inv.filter(i=>ING[i])))]);
      toast(`기록 ${add.length}개를 불러왔어요`);back();
    }catch(e){toast('백업 내용을 읽을 수 없어요');}
  };
  const w=s.querySelector('#wipe');let armed=false;
  w.onclick=()=>{if(!armed){armed=true;w.textContent='정말 모두 지울까요? 한 번 더 누르세요';return;}
    store.get('records',[]).forEach(r=>{if(r.photo)PDB.del(r.photo);});
    store.set('records',[]);store.set('lastResult',null);store.set('inv',[]);toast('모두 지웠어요');back();};
}
async function copyText(t,msg){
  try{await navigator.clipboard.writeText(t);toast(msg);return;}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(ok){toast(msg);return;}}catch(e){}
  toast('복사가 안 돼요. 주소창의 주소를 직접 복사해 주세요');
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400);}

/* ---------- 시작 ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b&&!b.closest('.sheet')){e.preventDefault();if(b.dataset.go==='pick'&&S.tab==='pick')S.quiz=null;go(b.dataset.go);}});
$('#settingsBtn').onclick=openSettings;
function wineBottleSVG(){const id='wb'+(++BID);return `<svg width="46" height="130" viewBox="0 0 60 170" aria-hidden="true"><defs><linearGradient id="${id}g" x1="0" x2="1"><stop offset="0" stop-color="#2E000B"/><stop offset=".25" stop-color="#7A0424"/><stop offset=".38" stop-color="#E0315F"/><stop offset=".5" stop-color="#B30737"/><stop offset="1" stop-color="#2E000B"/></linearGradient><linearGradient id="${id}f" x1="0" x2="1"><stop offset="0" stop-color="#5E4416"/><stop offset=".3" stop-color="#C9A04E"/><stop offset=".45" stop-color="#F8E6B4"/><stop offset=".65" stop-color="#B8913E"/><stop offset="1" stop-color="#4E3810"/></linearGradient></defs><path d="M24 12H36V50C36 58 52 62 52 77V160Q52 166 46 166H14Q8 166 8 160V77C8 62 24 58 24 50Z" fill="url(#${id}g)"/><rect x="22.6" y="3" width="14.8" height="36" rx="2" fill="url(#${id}f)"/><path d="M8.3 92Q30 97 51.7 92V140Q30 145 8.3 140Z" fill="#FBF5EA"/><text x="30" y="122" text-anchor="middle" font-size="9" font-weight="300" letter-spacing=".5" fill="#B30737" font-family="Noto Sans KR,sans-serif">Wine<tspan fill="#B88A3E">Pick</tspan></text><rect x="13" y="82" width="2.6" height="76" rx="1.3" fill="#fff" opacity=".35"/></svg>`;}
function askWine(){
  const o=document.createElement('div');o.className='celebrate';
  o.innerHTML=`<div class="cel-card wp-card"><div class="cel-medal" style="margin-top:-86px">${wineBottleSVG()}</div>
  <div class="cel-k">🍷 Psst…</div><div class="cel-n" style="font-size:22px;margin-top:4px">와인도 좋아하세요?</div><div class="cel-e">Do you like wine?</div>
  <p class="small" style="color:#69735E;margin:12px 4px 16px">와인은 WinePick에서 입맛에 맞게 골라 드려요.</p>
  <a class="btn block wp" href="${WINEPICK_URL}" target="_blank" rel="noopener" id="wpYes">좋아요! WinePick 열기</a>
  <button class="btn ghost block" id="wpNo" style="margin-top:10px;border:0">오늘은 칵테일만</button></div>`;
  const close=()=>o.remove();
  o.onclick=e=>{if(e.target===o)close();};
  o.querySelector('#wpYes').addEventListener('click',()=>setTimeout(close,300));
  o.querySelector('#wpNo').onclick=()=>{close();toast('칵테일도 좋은 선택이에요 🍸');};
  document.body.appendChild(o);try{navigator.vibrate&&navigator.vibrate(25);}catch(e){}
}
(function(){
  const b=$('.brand');let t=null,long=false,sx=0,sy=0;
  const cancel=()=>{clearTimeout(t);t=null;b.classList.remove('press');};
  b.addEventListener('pointerdown',e=>{long=false;sx=e.clientX;sy=e.clientY;b.classList.add('press');t=setTimeout(()=>{t=null;long=true;b.classList.remove('press');askWine();},650);});
  b.addEventListener('pointermove',e=>{if(t&&(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10))cancel();});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,cancel));
  b.addEventListener('contextmenu',e=>e.preventDefault());
  b.addEventListener('click',e=>{if(long){e.preventDefault();e.stopPropagation();long=false;}},true);
})();
S.level=store.get('level','basic')||'basic';
(function splash(){
  const sp=$('#splash');if(!sp)return;
  for(let i=0;i<16;i++){const b=document.createElement('i');b.className='bub';const z=4+Math.random()*9;
    b.style.cssText=`width:${z}px;height:${z}px;left:${Math.random()*100}%;animation-duration:${4+Math.random()*4}s;animation-delay:${Math.random()*3}s;--dx:${(Math.random()-.5)*60}px`;sp.appendChild(b);}
  let reduced=false;try{reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  let done=false;
  function leave(){if(done)return;done=true;sp.classList.add('out');const app=$('#app');app.classList.add('enter');
    setTimeout(()=>{sp.remove();app.classList.remove('enter');},850);}
  sp.addEventListener('click',leave);
  sp.addEventListener('touchend',e=>{e.preventDefault();leave();},{passive:false});
  setTimeout(leave,reduced?1500:4600);
  sp.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();leave();}});
  try{sp.focus();}catch(e){}
})();
S.tab='home';try{if(location.hash)history.replaceState(null,'',location.pathname+location.search);}catch(e){}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h!==S.tab&&TABS.includes(h)){S.tab=h;render();}});
render();
})();
</script>
